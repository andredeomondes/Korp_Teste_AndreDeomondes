services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 10

  estoque:
    build: ./services/estoque
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Estoque: Host=postgres;Port=5432;Database=estoque;Username=postgres;Password=postgres
      Frontend__Origin: http://localhost:4300
    ports:
      - '5001:8080'
    depends_on:
      postgres:
        condition: service_healthy

  faturamento:
    build: ./services/faturamento
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Faturamento: Host=postgres;Port=5432;Database=faturamento;Username=postgres;Password=postgres
      Frontend__Origin: http://localhost:4300
      Servicos__Estoque: http://estoque:8080
    ports:
      - '5002:8080'
    depends_on:
      postgres:
        condition: service_healthy
      estoque:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - '4300:80'
    depends_on:
      - estoque
      - faturamento

volumes:
  postgres-data:
